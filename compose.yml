name: subooru

services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: subooru:${GIT_COMMIT:-latest}
    env_file: .env.prod
    volumes:
      - ./conf.yml:/app/conf.yml
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    healthcheck:
      test: wget --spider http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
